# ============================
#  BWORLD KASASI - SUNUCUNUN EN EFSANE KASASI
# ============================
# Keskinlik 6 kilic/balta, Verimlilik 6 kazma, P5 (Koruma 5) tam netherite
# set ve ozel bir Elytra. Vanilla'da bu seviyeler normalde imkansizdir,
# ama sistemimiz "enchants" alaniyla seviye sinirini yok sayar.
#
# Enchant yazim formati -> "ENCHANT_ADI:SEVIYE"
# Ornek: SHARPNESS:6, EFFICIENCY:6, PROTECTION:5
#
# Bu kasa efsanevi oldugu icin ici doldurma (basit) esya icermez,
# hepsi ust duzey oduldur - anahtari bulmak zaten zor olmali.

id: bworld
name: "&4&lBworld Kasasi"
description:
  - "&7Sunucunun en efsane kasasi!"
  - "&7Sadece en iyi oduller cikar."

animation: CSGO

key-item: TRIPWIRE_HOOK
key-item-model: cratesystem:bworld_key
key-glow: true
key-name: "&4&l&kA&r&4&lBworld Kasasi Anahtari&r&4&l&kA"
key-lore:
  - "&7Efsanevi kasa anahtari"
  - "&7Cok nadir bulunur!"

preview-item: NETHERITE_CHESTPLATE
# NOT: Duyurular her odul icin "commands" alaninda ayri ayri yazildigi
# icin genel broadcast-rare kapali - yoksa mesaj iki kere gider.
broadcast-rare: false
rare-chance-threshold: 0.0

items:
