    material: NETHERITE_SWORD
    amount: 1
    name: "&c&lKeskinlik 6 Kilic"
    lore:
      - "&7Efsanevi bir silah!"
    chance: 15.0
    glow: true
    unbreakable: true
    enchants:
      - "SHARPNESS:6"
      - "UNBREAKING:3"
      - "MENDING:1"
